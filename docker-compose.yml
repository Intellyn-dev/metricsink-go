version: "3.8"
services:
  metricsink:
    build: .
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/metricsink?sslmode=disable
      - GIN_MODE=release
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metricsink
      POSTGRES_PASSWORD: postgres
    volumes:
      - metricsink_db:/var/lib/postgresql/data
volumes:
  metricsink_db:
